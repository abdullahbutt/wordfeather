<style>
  /* Bootstrap's default dropdown z-index (1000) sits below several pages'
     sticky "Inhalt"/Quick-Jump sidebar (.jump-bar / .alphabet-nav, z-index
     1020) — without this, the Levels/Modules dropdown renders visually
     underneath that sidebar instead of on top of it. */
  #siteNavbar .dropdown-menu {
    z-index: 1040;
  }
  /* Bootstrap's .navbar-dark .nav-link defaults to 55% opacity white unless
     hovered/active — on a solid blue background that reads as faint/blurry
     rather than crisp. Override to fully opaque for legibility. */
  #siteNavbar .nav-link {
    color: #ffffff;
    font-weight: 500;
  }
  #siteNavbar .nav-link:hover,
  #siteNavbar .nav-link:focus {
    color: #ffffff;
  }
  /* Highlights whichever nav item matches the current page (added by the
     script at the bottom of this file, since header.html is injected
     fragment-only and has no page-load hook of its own). */
  #siteNavbar .nav-link.active {
    color: #ffffff;
    font-weight: 700;
    position: relative;
  }
  #siteNavbar .nav-item > .nav-link.active::after {
    content: '';
    position: absolute;
    left: 0.5rem;
    right: 0.5rem;
    bottom: -2px;
    height: 3px;
    border-radius: 2px;
    background: #ffffff;
  }
  /* Quiz and "Leben in Deutschland" both use this same treatment: bold
     accent-colored text by default (not a filled pill), so they stand out
     from the plain white nav-links without looking like they're already
     the active/current page. */
  #siteNavbar .nav-link.ext-highlight {
    font-weight: 700;
  }
  /* white on the blue bar is the only colour that reaches the 4.5 : 1 contrast (WCAG 2.2 AA); the accent is an underline instead */
  #siteNavbar .nav-link.quiz-highlight,
  #siteNavbar .nav-link.leben-highlight {
    color: #ffffff !important;
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 5px;
  }
  #siteNavbar .btn-outline-light {
    --bs-btn-color: #ffffff;
  }
  #siteNavbar .nav-link.ext-highlight.active {
    background: #ffffff;
    border-radius: 999px;
    padding: 0.35rem 0.9rem !important;
    margin: 0 0.15rem;
    color: #1d4ed8 !important;
  }
  #siteNavbar .nav-link.ext-highlight.active::after {
    display: none; /* the pill fill itself is the active indicator here */
  }

<script>
(function () {
    // header.html is injected via innerHTML into a placeholder on every
    // page, so it has no "page load" of its own to hook into — this runs
    // immediately once the fragment is inserted, comparing the CURRENT
    // page's path against each nav link's own path to decide which one(s)
    // to mark active. Handles both root-level pages (dictionary.html,
    // quiz.html) and level pages (/A1/..., /B1/..., etc.).
    var path = window.location.pathname;

    function markActive(id) {
        var el = document.getElementById(id);
        if (el) el.classList.add('active');
    }

    if (path.indexOf('/dictionary.html') !== -1) {
        markActive('nav-dictionary');
    } else if (path.indexOf('/quiz.html') !== -1) {
        markActive('nav-quiz');
    } else if (/^\/[ABC][12]\//.test(path)) {
        // Any page inside /A1/, /A2/, /B1/, /B2/, /C1/, /C2/ — highlight the
        // "Levels" dropdown toggle itself, since there's no single matching
        // top-level link for level sub-pages.
        markActive('nav-levels');
    }
})();
</script>
