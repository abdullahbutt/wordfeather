    function renderHeader(html) {
        html = html.replace(/BASE\//g, '/');
        document.getElementById('header-placeholder').innerHTML = html;
        var btn = document.getElementById('themeToggle');
        if (btn) {
            function syncBtn() {
                var dark = document.documentElement.getAttribute('data-bs-theme') === 'dark';
                btn.textContent = dark ? '☀️ Light' : '🌙 Dark';

            syncBtn();
            btn.addEventListener('click', function () {

                localStorage.setItem('theme', next);

        .then(function (r) { return r.ok ? r.text() : Promise.reject(new Error('header fetch failed')); })

  // ---------------------------------------------------------------
  // Level tiles
  // ---------------------------------------------------------------
  var levelContainer = document.getElementById('levelChecks');
  var selectedLevel = 'A1';

  LEVELS.forEach(function (lvl, i) {
    var tile = document.createElement('div');
    tile.className = 'level-check' + (i === 0 ? ' active' : '');
    tile.textContent = lvl;
    tile.addEventListener('click', function () {
      document.querySelectorAll('.level-check').forEach(function (t) { t.classList.remove('active'); });
      tile.classList.add('active');
      selectedLevel = lvl;
      updateLevelInfo();
    });
    levelContainer.appendChild(tile);
  });

  function updateLevelInfo() {
    document.getElementById('levelInfo').textContent = LEVEL_INFO[selectedLevel];
  }
  updateLevelInfo();

  // ---------------------------------------------------------------
  // Session state
  // ---------------------------------------------------------------
  var session = null;

  document.getElementById('startBtn').addEventListener('click', function () {
    var items = DATA[selectedLevel];
    session = { items: items, index: 0, correctCount: 0, totalQuestions: 0 };
    items.forEach(function (it) { session.totalQuestions += it.questions.length; });
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('itemScreen').classList.remove('hidden');
    renderItem();
  });

  function renderItem() {
    var item = session.items[session.index];
    document.getElementById('itemMeta').textContent = selectedLevel + ' · ' + item.part;
    document.getElementById('itemTitle').textContent = item.title;

    var pct = Math.round((session.index / session.items.length) * 100);
    document.getElementById('itemProgressBar').style.width = pct + '%';
    document.getElementById('itemProgressText').textContent = 'Text ' + (session.index + 1) + ' / ' + session.items.length;

    // Passage stays fully visible and scrollable the whole time — no
    // locking, no reveal restriction — matching real Lesen exam
    // conditions, unlike the one-shot Hören audio.
    var passageEl = document.getElementById('passageCard');
    passageEl.innerHTML = '<span class="passage-source-tag">' + item.tag + '</span>';
    item.passage.forEach(function (para) {
      var p = document.createElement('p');
      p.textContent = para;
      passageEl.appendChild(p);
    });
    passageEl.scrollTop = 0;

    var qContainer = document.getElementById('questionsContainer');
    qContainer.innerHTML = '';
    item.questions.forEach(function (q, qi) {
      var card = document.createElement('div');
      card.className = 'card p-3 mb-3';

      var qText = document.createElement('p');
      qText.className = 'fw-semibold mb-3';
      qText.textContent = (qi + 1) + '. ' + q.text;
      card.appendChild(qText);

      var optWrap = document.createElement('div');
      optWrap.className = 'd-grid gap-2';
      q.options.forEach(function (optText) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = optText;
        btn.addEventListener('click', function () { handleAnswerClick(btn, card, q); });
        optWrap.appendChild(btn);
      });
      card.appendChild(optWrap);

      qContainer.appendChild(card);
    });

    document.getElementById('nextItemBtn').classList.add('hidden');
  }

  function handleAnswerClick(clickedBtn, card, q) {
    if (clickedBtn.disabled) return;
    var correct = clickedBtn.textContent === q.options[q.answerIndex];

    card.querySelectorAll('.option-btn').forEach(function (b) {
      b.disabled = true;
      if (b.textContent === q.options[q.answerIndex]) {
        b.classList.add('correct-choice');
      } else if (b === clickedBtn) {
        b.classList.add('incorrect-choice');
      }
    });

    if (correct) session.correctCount++;

    var cards = document.querySelectorAll('#questionsContainer .card');
    var allAnswered = Array.prototype.every.call(cards, function (c) {
      return c.querySelector('.option-btn:not(:disabled)') === null;
    });

    if (allAnswered) {
      var isLast = session.index + 1 >= session.items.length;
      var nextBtn = document.getElementById('nextItemBtn');
      nextBtn.textContent = isLast ? 'Ergebnis anzeigen / Show results →' : 'Nächster Text / Next text →';
      nextBtn.classList.remove('hidden');
    }
  }

  document.getElementById('nextItemBtn').addEventListener('click', function () {
    session.index++;
    if (session.index >= session.items.length) {
      finishSession();
    } else {
      renderItem();
    }
  });

  function finishSession() {
    document.getElementById('itemScreen').classList.add('hidden');
    var pct = Math.round((session.correctCount / session.totalQuestions) * 100);
    document.getElementById('scoreRing').textContent = pct + '%';
    document.getElementById('scoreDetail').textContent = session.correctCount + ' von ' + session.totalQuestions + ' richtig / ' + session.correctCount + ' of ' + session.totalQuestions + ' correct';
    document.getElementById('resultsScreen').classList.remove('hidden');
  }

  document.getElementById('retryBtn').addEventListener('click', function () {
    document.getElementById('resultsScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
  });

})();
