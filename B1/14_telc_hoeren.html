    <script>
(function () {
    var D = window.TELC_HOEREN || [];
    var KEY = 'wf_telc_hoeren_v1';
    var root = document.getElementById('tx-root');
    var store = {};
    try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
    function st(no) { return store[no] || (store[no] = { a: {}, done: false, secs: 0, best: null, tries: 0 }); }
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
    function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r; }
    var INSTR = {"1": "Sie hören nun fünf kurze Texte. Dazu sollen Sie fünf Aufgaben lösen. Sie hören diese Texte nur einmal. Entscheiden Sie beim Hören, ob die Aussagen 41–45 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 41–45. Markieren Sie PLUS (+) gleich richtig und MINUS (−) gleich falsch auf dem Antwortbogen. Lesen Sie jetzt die Aufgaben 41–45. Sie haben dazu 30 Sekunden Zeit.", "2": "Sie hören nun ein Gespräch. Dazu sollen Sie zehn Aufgaben lösen. Sie hören das Gespräch zweimal. Entscheiden Sie beim Hören, ob die Aussagen 46–55 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 46–55. Markieren Sie PLUS (+) gleich richtig und MINUS (−) gleich falsch auf dem Antwortbogen. Lesen Sie jetzt die Aufgaben 46–55. Sie haben dazu 30 Sekunden Zeit.", "3": "Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Entscheiden Sie beim Hören, ob die Aussagen 56–60 richtig oder falsch sind. Markieren Sie Ihre Lösungen auf dem Antwortbogen bei den Aufgaben 56–60. Markieren Sie PLUS (+) gleich richtig und MINUS (−) gleich falsch auf dem Antwortbogen."};
    var timer = null, running = false, view = null;

    function allItems(ex) { var a = []; ['1', '2', '3'].forEach(function (t) { if (ex.teile[t]) a = a.concat(ex.teile[t].items); }); return a; }
    function stopClock() { running = false; if (timer) { clearInterval(timer); timer = null; } }

    function showList() {
        stopClock(); view = null; root.textContent = '';
        document.title = '14 telc Hören Prüfungen - B1';
        var h = el('h1', null, 'telc B1 Hören: Prüfungen'); root.appendChild(h);
        root.appendChild(el('p', 'lead-s', D.length + ' listening exams (Hörverstehen, Teil 1–3, 20 statements each). Pick an exam, play the recording, mark + (richtig) or − (falsch) on the answer sheet and press Submit. The English translations stay hidden until you click the eye.'));
        var g = el('div', 'tx-grid');
        D.forEach(function (ex) {

            c.appendChild(el('div', 'meta', teile + ' · ' + items.length + ' statements'));
            var status = el('div', 'st', 'Not started');
            if (s.done && s.best) { status.className = 'st done'; status.textContent = 'Best: ' + s.best.score + '/' + s.best.total + ' (' + Math.round(100 * s.best.score / s.best.total) + ' %)'; }

            c.appendChild(status);
            var b = el('a', 'btn btn-sm ' + (s.done ? 'btn-outline-primary' : 'btn-primary'), s.done ? 'Open again' : (n ? 'Continue' : 'Start'));
            b.href = '#exam-' + ex.no; c.appendChild(b); g.appendChild(c);

        root.appendChild(el('p', 'tx-note mt-3', 'Your answers and results stay in this browser only. The book prints only the statements and the answer keys; the audio is on YouTube.'));
    }

    function score(ex) {
        var s = st(ex.no), per = {}, tot = 0, all = 0;
        Object.keys(ex.teile).forEach(function (t) {
            var p = 0, items = ex.teile[t].items;
            items.forEach(function (it) { if (s.a[it.n] === it.a) p++; });
            per[t] = [p, items.length]; tot += p; all += items.length;
        });
        return { per: per, tot: tot, all: all };
    }

                var b = bar.querySelector('[data-teil="' + t + '"]'), k = 0;
                ex.teile[t].items.forEach(function (it) { if (s.a[it.n]) k++; });
                b.textContent = 'Teil ' + t + ' · ' + k + '/' + ex.teile[t].items.length;
                b.className = 'btn btn-sm ' + (view.teil === t ? 'btn-primary' : 'btn-outline-secondary');
            });
            clock.textContent = fmt(s.secs);
            startBtn.textContent = s.done ? '' : (running ? '⏸ Pause' : (s.secs ? '▶ Resume' : '▶ Start clock'));
            startBtn.style.display = s.done ? 'none' : '';
            subBtn.textContent = s.done ? 'Try again' : (view.confirm ? 'Submit anyway' : 'Submit');
            subBtn.className = 'btn btn-sm ' + (s.done ? 'btn-outline-primary' : 'btn-success');
        }
        function startClock() {
            if (running || s.done) return;
            running = true;
            timer = setInterval(function () { s.secs++; clock.textContent = fmt(s.secs); if (s.secs % 10 === 0) save(); }, 1000);
            refreshBar();
        }
        function pauseClock() { stopClock(); save(); refreshBar(); }

        function setAnswer(it, v, row) {
            if (s.done) return;
            s.a[it.n] = (s.a[it.n] === v) ? undefined : v;
            if (!s.a[it.n]) delete s.a[it.n];
            view.confirm = false; startClock(); save();
            row.querySelectorAll('.tx-ans button').forEach(function (b) { b.setAttribute('aria-pressed', String(s.a[it.n] === b.dataset.v)); });
            refreshBar();
        }

        function renderPanel() {
            panel.textContent = '';
            var t = view.teil, T = ex.teile[t];
            var box = el('div', 'tx-box');
            box.appendChild(el('div', 'lbl', 'Hörverstehen, Teil ' + t));
            box.appendChild(el('div', 'tx-instr', INSTR[t]));
            var pills = el('div', 'tx-pills');
            pills.appendChild(el('span', 'tx-pill', T.once ? '🎧 you hear it once' : '🎧 you hear it twice'));
            if (T.read) pills.appendChild(el('span', 'tx-pill', '⏱ 30 seconds to read the statements'));
            pills.appendChild(el('span', 'tx-pill', 'statements ' + T.items[0].n + '–' + T.items[T.items.length - 1].n));
            box.appendChild(pills);
            panel.appendChild(box);

            var a = el('div', 'tx-box tx-audio');
            a.appendChild(el('div', 'lbl', 'The recording'));
            var holder = el('div');
            var load = el('button', 'btn btn-sm btn-outline-primary', '▶ Load the YouTube video (all 3 Teile)');
            load.type = 'button';
            load.addEventListener('click', function () {
                var f = document.createElement('iframe');
                f.src = 'https://www.youtube-nocookie.com/embed/' + ex.video + '?rel=0';
                f.title = 'Prüfung ' + ex.no + ' ' + ex.title + ' Hören';
                f.allow = 'encrypted-media; picture-in-picture'; f.setAttribute('allowfullscreen', '');
                holder.textContent = ''; holder.appendChild(f);
            });
            var open = el('a', 'btn btn-sm btn-link', 'Open on YouTube ↗'); open.href = 'https://www.youtube.com/watch?v=' + ex.video; open.target = '_blank'; open.rel = 'noopener';
            var row = el('div'); row.appendChild(load); row.appendChild(open); a.appendChild(row); a.appendChild(holder);
            a.appendChild(el('div', 'small mt-2', 'One video holds Teil 1, 2 and 3. It shows the statements and, at the very end, the answers: do not scrub to the end before you submit. YouTube cannot enforce “you hear it only once”, so keep to that rule yourself.'));
            panel.appendChild(a);

            var list = el('div', 'tx-box');
            list.appendChild(el('div', 'lbl', 'Antwortbogen · Teil ' + t + (T.fromVideo ? ' (typed from the video, not in the book)' : '')));
            T.items.forEach(function (it) {
                var r = el('div', 'tx-row');
                r.appendChild(el('div', 'no', String(it.n)));
                var body = el('div');
                var de = el('div', 'de', it.de + (it.warn ? ' ⚠' : ''));
                var eye = el('button', 'eye', '👁'); eye.type = 'button'; eye.setAttribute('aria-pressed', 'false'); eye.title = 'Show / hide the English translation'; eye.setAttribute('aria-label', 'Show or hide the English translation');
                eye.addEventListener('click', function () { var on = !r.classList.contains('show-en'); r.classList.toggle('show-en', on); eye.setAttribute('aria-pressed', String(on)); });
                de.appendChild(eye); body.appendChild(de); body.appendChild(el('div', 'en', it.en)); r.appendChild(body);
                var ans = el('div', 'tx-ans');
                [['+', 'richtig'], ['-', 'falsch']].forEach(function (p) {
                    var b = el('button', null, p[0] === '+' ? '+' : '−'); b.type = 'button'; b.dataset.v = p[0];
                    var sm = el('small', null, p[1]); b.appendChild(sm);
                    b.setAttribute('aria-pressed', String(s.a[it.n] === p[0])); b.disabled = !!s.done;
                    b.setAttribute('aria-label', it.n + ': ' + p[1]);
                    b.addEventListener('click', function () { setAnswer(it, p[0], r); });
                    ans.appendChild(b);
                });
                r.appendChild(ans);
                if (s.done) {
                    var ok = s.a[it.n] === it.a; r.classList.add(ok ? 'ok' : 'bad');
                    var fb = el('div', 'fb');
                    if (ok) fb.appendChild(el('span', 'good', 'Correct: ' + (it.a === '+' ? '+ richtig' : '− falsch')));
                    else { fb.appendChild(el('span', 'wrong', (s.a[it.n] ? 'Your answer: ' + (s.a[it.n] === '+' ? '+' : '−') : 'No answer') + ' · ')); fb.appendChild(el('span', 'good', 'Correct: ' + (it.a === '+' ? '+ richtig' : '− falsch'))); }
                    if (it.conf) fb.appendChild(el('span', 'warn', 'Note: the same statement is printed in exam ' + it.conf + ' with the other answer. One of the two keys is probably wrong; check it against the recording.'));
                    if (it.warn) fb.appendChild(el('span', 'warn', 'Note: this sentence is cut off or garbled in the book. It is shown as printed.'));
                    r.appendChild(fb);
                }
                list.appendChild(r);
            });
            panel.appendChild(list);
            var nav = el('div', 'd-flex gap-2 justify-content-between');
            var tl = Object.keys(ex.teile), idx = tl.indexOf(t);
            if (idx > 0) { var pb = el('button', 'btn btn-outline-secondary btn-sm', '← Teil ' + tl[idx - 1]); pb.type = 'button'; pb.addEventListener('click', function () { go(tl[idx - 1]); }); nav.appendChild(pb); } else nav.appendChild(el('span'));
            if (idx < tl.length - 1) { var nb = el('button', 'btn btn-primary btn-sm', 'Teil ' + tl[idx + 1] + ' →'); nb.type = 'button'; nb.addEventListener('click', function () { go(tl[idx + 1]); }); nav.appendChild(nb); }
            panel.appendChild(nav);
        }
        function go(t) { view.teil = t; renderPanel(); refreshBar(); window.scrollTo(0, 0); }

        function renderResult() {
            resultBox.textContent = '';
            if (!s.done) return;
            var r = score(ex), pct = Math.round(100 * r.tot / r.all);
            resultBox.className = 'tx-result ' + (pct >= 60 ? 'pass' : 'fail');
            resultBox.appendChild(el('div', 'big', r.tot + ' / ' + r.all + ' correct (' + pct + ' %)'));
            resultBox.appendChild(el('div', null, Object.keys(r.per).map(function (t) { return 'Teil ' + t + ': ' + r.per[t][0] + '/' + r.per[t][1]; }).join(' · ') + ' · time ' + fmt(s.secs)));
            resultBox.appendChild(el('div', 'tx-note mt-1', pct >= 60 ? 'This is 60 % or more, the usual pass mark per exam part in telc.' : 'Below 60 %. Listen again and compare with the correct answers below.'));
        }

        root.textContent = '';
        var crumb = el('div', 'tx-crumb'); var back = el('a', null, '← All exams'); back.href = '#'; crumb.appendChild(back); root.appendChild(crumb);
        root.appendChild(el('h1', null, 'Prüfung ' + ex.no + ': ' + ex.title));
        root.appendChild(el('p', 'lead-s', 'telc B1 · Hörverstehen · ' + Object.keys(ex.teile).length + ' Teile · ' + items.length + ' statements' + (ex.teile['1'] && ex.teile['1'].fromVideo ? ' · Teil 1 typed from the video' : '')));
        bar = el('div', 'tx-bar');
        var tabs = el('div', 'tabs');
        Object.keys(ex.teile).forEach(function (t) { var b = el('button', 'btn btn-sm', ''); b.type = 'button'; b.dataset.teil = t; b.addEventListener('click', function () { go(t); }); tabs.appendChild(b); });
        bar.appendChild(tabs); bar.appendChild(el('span', 'spacer'));
        clock = el('span', 'tx-clock', fmt(s.secs)); bar.appendChild(clock);
        startBtn = el('button', 'btn btn-sm btn-outline-secondary'); startBtn.type = 'button';
        startBtn.addEventListener('click', function () { if (running) pauseClock(); else startClock(); });
        bar.appendChild(startBtn);
        countEl = el('span', 'tx-count'); bar.appendChild(countEl);
        subBtn = el('button', 'btn btn-sm btn-success'); subBtn.type = 'button';
        subBtn.addEventListener('click', function () {
            if (s.done) {
                s.a = {}; s.done = false; s.secs = 0; view.confirm = false; save(); renderResult(); renderPanel(); refreshBar(); return;
            }
            if (counts() < items.length && !view.confirm) { view.confirm = true; refreshBar(); return; }
            stopClock(); s.done = true; s.tries = (s.tries || 0) + 1;
            var r = score(ex);
            if (!s.best || r.tot >= s.best.score) s.best = { score: r.tot, total: r.all };
            save(); renderResult(); renderPanel(); refreshBar(); resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        bar.appendChild(subBtn);
        root.appendChild(bar);
        resultBox = el('div'); root.appendChild(resultBox);
        panel = el('div'); root.appendChild(panel);
        renderResult(); renderPanel(); refreshBar();
        if (!s.done && counts() === 0 && s.secs === 0) root.appendChild(el('p', 'tx-note', 'Tip: press “Start clock” when you press play. The clock also starts with your first answer.'));
    }

    function route() {
        var m = /^#exam-(\d+)$/.exec(location.hash);
        if (m) showExam(parseInt(m[1], 10)); else showList();
        window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', route);
    window.addEventListener('pagehide', function () { save(); });
    route();
})();
</script>
</body>
</html>
