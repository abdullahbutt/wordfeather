    <script>
(function () {
    var D = window.TELC_LESEN || [];

    var root = document.getElementById('tx-root');
    var store = {};
    try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { store = {}; }
    function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
    var MIN = {"1": 15, "2": 15, "3": 25}, PTS = {"1": 5, "2": 5, "3": 2.5}, INSTR = {"1": "Lesen Sie die Überschriften a–j und die Texte 1–5. Welche Überschrift passt zu welchem Text? Jede Überschrift passt nur einmal. Fünf Überschriften bleiben übrig.", "2": "Lesen Sie den Text und die Aufgaben 6–10 dazu. Welche Lösung (a, b oder c) ist jeweils richtig?", "3": "Lesen Sie die Situationen 11–20 und die Anzeigen a–l. Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal benutzen. Wenn keine Anzeige passt, markieren Sie X."};
    function st(no) { return store[no] || (store[no] = { a: {}, done: false, left: { '1': MIN['1'] * 60, '2': MIN['2'] * 60, '3': MIN['3'] * 60 }, best: null, tries: 0 }); }
    function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

    function ids(ex, t) {
        var T = ex.teile[t];
        if (t === '1') return T.texts.map(function (x) { return x.n; });
        if (t === '2') return T.qs.map(function (x) { return x.n; });
        return T.sits.map(function (x) { return x.n; });
    }
    function maxPts(ex) { var m = 0; Object.keys(ex.teile).forEach(function (t) { m += ids(ex, t).length * PTS[t]; }); return m; }
    function score(ex) {
        var s = st(ex.no), per = {}, tot = 0;
        Object.keys(ex.teile).forEach(function (t) {
            var k = 0, n = ids(ex, t).length;
            ids(ex, t).forEach(function (i) { if (s.a[i] === ex.teile[t].ans[i].a) k++; });
            per[t] = { ok: k, n: n, pts: k * PTS[t], max: n * PTS[t] }; tot += k * PTS[t];
        });
        return { per: per, tot: tot, max: maxPts(ex) };
    }
    var timer = null, running = null;
    function stopClock() { running = null; if (timer) { clearInterval(timer); timer = null; } }

    function showList() {
        stopClock(); root.textContent = '';
        document.title = '15 telc Lesen Prüfungen - B1';

        var g = el('div', 'tx-grid');
        D.forEach(function (ex) {
            var s = st(ex.no), c = el('div', 'tx-card'), n = Object.keys(s.a).length, total = 0;

            c.appendChild(el('div', 'meta', Object.keys(ex.teile).map(function (t) { return 'Teil ' + t; }).join(' · ') + ' · ' + total + ' items' + (Object.keys(ex.teile).length < 3 ? ' (Teil 2 missing)' : '')));
            var status = el('div', 'st', 'Not started');
            if (s.done && s.best) { status.className = 'st done'; status.textContent = 'Best: ' + s.best.score + '/' + s.best.max + ' points (' + Math.round(100 * s.best.score / s.best.max) + ' %)'; }
            else if (n) { status.className = 'st prog'; status.textContent = 'In progress: ' + n + '/' + total + ' answered'; }
            c.appendChild(status);
            var b = el('a', 'btn btn-sm ' + (s.done ? 'btn-outline-primary' : 'btn-primary'), s.done ? 'Open again' : (n ? 'Continue' : 'Start'));
            b.href = '#exam-' + ex.no; c.appendChild(b); g.appendChild(c);
        });
        root.appendChild(g);
        root.appendChild(el('p', 'tx-note mt-3', 'Your answers and results stay in this browser only. The exams are the mock exams of the book "Prüfungs Buch Petra". The other skills: Hören has its own page.'));
    }

    function eye(box) {
        var b = el('button', 'eye', '👁'); b.type = 'button'; b.setAttribute('aria-pressed', 'false'); b.title = 'Show / hide the English translation'; b.setAttribute('aria-label', 'Show or hide the English translation');
        b.addEventListener('click', function () { var on = !box.classList.contains('show-en'); box.classList.toggle('show-en', on); b.setAttribute('aria-pressed', String(on)); });
        return b;
    }

    function showExam(no) {
        var ex = D.filter(function (e) { return e.no === no; })[0];
        if (!ex) { location.hash = ''; return; }
        stopClock();
        var s = st(no), tl = Object.keys(ex.teile), all = []; tl.forEach(function (t) { all = all.concat(ids(ex, t)); });
        var view = { teil: tl[0], confirm: false };
        document.title = 'Prüfung ' + ex.no + ' ' + ex.title + ' - telc B1 Lesen';
        var bar, clock, countEl, subBtn, startBtn, panel, resultBox;
        function answered() { var n = 0; all.forEach(function (i) { if (s.a[i]) n++; }); return n; }
        function refreshBar() {
            countEl.textContent = answered() + '/' + all.length + ' answered';
            tl.forEach(function (t) {
                var b = bar.querySelector('[data-teil="' + t + '"]'), k = 0, a = ids(ex, t);
                a.forEach(function (i) { if (s.a[i]) k++; });
                b.textContent = 'Teil ' + t + ' · ' + k + '/' + a.length;
                b.className = 'btn btn-sm ' + (view.teil === t ? 'btn-primary' : 'btn-outline-secondary');
            });
            var left = s.left[view.teil];
            clock.textContent = fmt(left); clock.className = 'tx-clock' + (left <= 0 ? ' over' : '');
            clock.title = 'Time left in Teil ' + view.teil + ' (' + MIN[view.teil] + ' min)';
            startBtn.style.display = s.done ? 'none' : '';
            startBtn.textContent = running === view.teil ? '⏸ Pause' : (left < MIN[view.teil] * 60 ? '▶ Resume' : '▶ Start clock');
            subBtn.textContent = s.done ? 'Try again' : (view.confirm ? 'Submit anyway' : 'Submit');
            subBtn.className = 'btn btn-sm ' + (s.done ? 'btn-outline-primary' : 'btn-success');
        }
        function startClock() {
            if (s.done || running === view.teil) return;
            stopClock(); var t = view.teil; running = t;
            timer = setInterval(function () { s.left[t]--; if (view.teil === t) { clock.textContent = fmt(s.left[t]); clock.className = 'tx-clock' + (s.left[t] <= 0 ? ' over' : ''); } if (s.left[t] % 10 === 0) save(); }, 1000);
            refreshBar();
        }
        function pauseClock() { stopClock(); save(); refreshBar(); }
        function setAns(i, v) {
            if (s.done) return;
            if (!v) delete s.a[i]; else s.a[i] = v;
            view.confirm = false; if (!running) startClock(); save(); refreshBar();
        }
        function feedback(box, t, i, given) {
            var A = ex.teile[t].ans[i], ok = given === A.a, fb = el('div', 'fb');
            box.classList.add(ok ? 'ok' : 'bad');
            var shown = function (v) { return v === 'X' ? 'X (no ad fits)' : v; };
            if (ok) fb.appendChild(el('span', 'good', 'Correct: ' + shown(A.a)));
            else { fb.appendChild(el('span', 'wrong', (given ? 'Your answer: ' + shown(given) : 'No answer') + ' · ')); fb.appendChild(el('span', 'good', 'Correct: ' + shown(A.a))); }
            var d = el('details'); d.appendChild(el('summary', null, 'Why?'));
            d.appendChild(el('div', null, A.tip + '. ' + A.why));
            if (A.ev && A.ev[0]) { d.appendChild(el('div', null, '“' + A.ev[0] + '”')); d.appendChild(el('div', null, A.ev[1])); }
            fb.appendChild(d); box.appendChild(fb);
        }
        function selectFor(t, i, opts) {
            var sel = el('select', 'form-select form-select-sm'); sel.setAttribute('aria-label', 'Answer for ' + i);
            var o0 = el('option', null, '– choose –'); o0.value = ''; sel.appendChild(o0);
            opts.forEach(function (o) { var op = el('option', null, o === 'X' ? 'X – no ad fits' : o); op.value = o; sel.appendChild(op); });
            sel.value = s.a[i] || ''; sel.disabled = !!s.done;
            sel.addEventListener('change', function () { setAns(i, sel.value); if (t === '1' || t === '3') markUsed(t); });
            return sel;
        }
        function markUsed(t) {
            var T = ex.teile[t], list = t === '1' ? T.heads : T.ads, use = {};
            ids(ex, t).forEach(function (i) { var v = s.a[i]; if (v && v !== 'X') (use[v] = use[v] || []).push(i); });
            panel.querySelectorAll('[data-lt]').forEach(function (row) {
                var l = row.dataset.lt, u = use[l] || [], tag = row.querySelector('.lz-used');
                row.classList.toggle('used', u.length > 0); tag.textContent = u.length ? '→ ' + u.join(', ') : ''; tag.style.display = u.length ? '' : 'none';
                tag.classList.toggle('dup', u.length > 1);
            });
        }
        function listBox(t, label, arr) {
            var box = el('div', 'tx-box'); box.appendChild(el('div', 'lbl', label));
            arr.forEach(function (x) {
                var r = el('div', t === '1' ? 'lz-head' : 'lz-ad'); r.dataset.lt = x.l;
                r.appendChild(el('span', 'l', x.l + ')'));
                var de = el('span', null, x.de); de.appendChild(eye(r)); r.appendChild(de);
                var u = el('span', 'lz-used'); u.style.display = 'none'; r.appendChild(u);
                r.appendChild(el('div', 'en', x.en)); box.appendChild(r);
            });
            return box;
        }
        function renderPanel() {
            panel.textContent = ''; var t = view.teil, T = ex.teile[t];
            var box = el('div', 'tx-box');
            box.appendChild(el('div', 'lbl', 'Leseverstehen, Teil ' + t + (T.de ? ' · ' + T.de : '')));
            box.appendChild(el('div', 'tx-instr', INSTR[t]));
            var pills = el('div', 'tx-pills');
            pills.appendChild(el('span', 'tx-pill', '⏱ ' + MIN[t] + ' minutes'));
            pills.appendChild(el('span', 'tx-pill', ids(ex, t).length + ' items × ' + PTS[t] + ' points = ' + ids(ex, t).length * PTS[t]));
            pills.appendChild(el('span', 'tx-pill', 'book p. ' + T.pages));
            box.appendChild(pills); panel.appendChild(box);

            var letters;
            if (t === '1') {
                var split1 = el('div', 'lz-split'), side1 = listBox('1', 'Überschriften', T.heads); side1.classList.add('lz-side'); split1.appendChild(side1);
                letters = T.heads.map(function (h) { return h.l; });
                var tb = el('div', 'tx-box'); tb.appendChild(el('div', 'lbl', 'Texte'));
                T.texts.forEach(function (x) {
                    var r = el('div', 'lz-item'); r.appendChild(el('div', 'no', x.n));
                    var b = el('div'); var de = el('div', 'de', x.de); de.appendChild(eye(r)); b.appendChild(de); b.appendChild(el('div', 'en', x.en)); r.appendChild(b);
                    var pk = el('div', 'pick'); pk.appendChild(el('span', null, 'Heading:')); pk.appendChild(selectFor('1', x.n, letters)); r.appendChild(pk);
                    if (s.done) feedback(r, '1', x.n, s.a[x.n]);
                    tb.appendChild(r);
                });
                split1.appendChild(tb); panel.appendChild(split1);
            } else if (t === '2') {
                var pb = el('div', 'tx-box'); pb.appendChild(el('div', 'lbl', 'Text'));
                T.paras.forEach(function (p) {
                    var d = el('div', 'lz-para'); d.appendChild(el('span', 'pn', p.n)); d.appendChild(document.createTextNode(p.de)); d.appendChild(eye(d)); d.appendChild(el('div', 'en', p.en)); pb.appendChild(d);
                });
                panel.appendChild(pb);
                var qb = el('div', 'tx-box'); qb.appendChild(el('div', 'lbl', 'Aufgaben'));
                T.qs.forEach(function (q) {
                    var r = el('div', 'lz-item'); r.appendChild(el('div', 'no', q.n));
                    var b = el('div'); var de = el('div', 'de', q.stem); de.appendChild(eye(r)); b.appendChild(de);
                    b.appendChild(el('div', 'en', q.stemEn + ' — ' + q.optsEn.join('  ')));
                    var opts = el('div', 'lz-opts');
                    q.opts.forEach(function (o) {
                        var v = o.charAt(0), bt = el('button', null, o); bt.type = 'button'; bt.setAttribute('aria-pressed', String(s.a[q.n] === v)); bt.disabled = !!s.done;
                        bt.addEventListener('click', function () {
                            if (s.done) return;
                            setAns(q.n, s.a[q.n] === v ? '' : v);
                            opts.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(s.a[q.n] === x.textContent.charAt(0))); });
                        });
                        opts.appendChild(bt);
                    });
                    b.appendChild(opts); r.appendChild(b);
                    if (s.done) feedback(r, '2', q.n, s.a[q.n]);
                    qb.appendChild(r);
                });
                panel.appendChild(qb);
            } else {
                var split3 = el('div', 'lz-split'), side3 = listBox('3', 'Anzeigen', T.ads); side3.classList.add('lz-side'); split3.appendChild(side3);
                letters = T.ads.map(function (a) { return a.l; }).concat(['X']);
                var sb = el('div', 'tx-box'); sb.appendChild(el('div', 'lbl', 'Situationen'));
                T.sits.forEach(function (x) {
                    var r = el('div', 'lz-item'); r.appendChild(el('div', 'no', x.n));
                    var b = el('div'); var de = el('div', 'de', x.de); de.appendChild(eye(r)); b.appendChild(de); b.appendChild(el('div', 'en', x.en)); r.appendChild(b);
                    var pk = el('div', 'pick'); pk.appendChild(el('span', null, 'Ad:')); pk.appendChild(selectFor('3', x.n, letters)); r.appendChild(pk);
                    if (s.done) feedback(r, '3', x.n, s.a[x.n]);
                    sb.appendChild(r);
                });
                split3.appendChild(sb); panel.appendChild(split3);
            }
            if (t !== '2') markUsed(t);
            (T.notes || []).forEach(function (n) { panel.appendChild(el('p', 'tx-note', 'Note: ' + n)); });
            var nav = el('div', 'd-flex gap-2 justify-content-between'), idx = tl.indexOf(t);
            if (idx > 0) { var pv = el('button', 'btn btn-outline-secondary btn-sm', '← Teil ' + tl[idx - 1]); pv.type = 'button'; pv.addEventListener('click', function () { go(tl[idx - 1]); }); nav.appendChild(pv); } else nav.appendChild(el('span'));
            if (idx < tl.length - 1) { var nx = el('button', 'btn btn-primary btn-sm', 'Teil ' + tl[idx + 1] + ' →'); nx.type = 'button'; nx.addEventListener('click', function () { go(tl[idx + 1]); }); nav.appendChild(nx); }
            panel.appendChild(nav);
        }
        function go(t) { var was = running; view.teil = t; if (was) { running = null; stopClock(); } renderPanel(); refreshBar(); window.scrollTo(0, 0); }
        function renderResult() {
            resultBox.textContent = ''; resultBox.className = '';
            if (!s.done) return;
            var r = score(ex), pct = Math.round(100 * r.tot / r.max);
            resultBox.className = 'tx-result ' + (pct >= 60 ? 'pass' : 'fail');
            resultBox.appendChild(el('div', 'big', r.tot + ' / ' + r.max + ' points (' + pct + ' %)'));
            resultBox.appendChild(el('div', null, Object.keys(r.per).map(function (t) { var p = r.per[t]; var used = MIN[t] * 60 - s.left[t]; return 'Teil ' + t + ': ' + p.ok + '/' + p.n + ' right = ' + p.pts + ' points · ' + fmt(Math.max(used, 0)) + ' used'; }).join('  |  ')));
            resultBox.appendChild(el('div', 'tx-note mt-1', (pct >= 60 ? '60 % or more, the usual pass mark in telc. ' : 'Below 60 %. ') + 'Open “Why?” under each item to see the trick and the line in the text.'));
            if (ex.notes && ex.notes.length) ex.notes.forEach(function (n) { resultBox.appendChild(el('div', 'tx-note', 'Note: ' + n)); });
        }
        root.textContent = '';
        var crumb = el('div', 'tx-crumb'), back = el('a', null, '← All exams'); back.href = '#'; crumb.appendChild(back); root.appendChild(crumb);
        root.appendChild(el('h1', null, 'Prüfung ' + ex.no + ': ' + ex.title));
        root.appendChild(el('p', 'lead-s', 'telc B1 · Leseverstehen · ' + tl.length + ' Teile · ' + all.length + ' items · max ' + maxPts(ex) + ' points · book p. ' + ex.book + (tl.length < 3 ? ' · Teil 2 is not in this exam yet' : '')));
        bar = el('div', 'tx-bar');
        var tabs = el('div', 'tabs');
        tl.forEach(function (t) { var b = el('button', 'btn btn-sm', ''); b.type = 'button'; b.dataset.teil = t; b.addEventListener('click', function () { go(t); }); tabs.appendChild(b); });
        bar.appendChild(tabs); bar.appendChild(el('span', 'spacer'));
        clock = el('span', 'tx-clock', ''); bar.appendChild(clock);
        startBtn = el('button', 'btn btn-sm btn-outline-secondary'); startBtn.type = 'button';
        startBtn.addEventListener('click', function () { if (running === view.teil) pauseClock(); else startClock(); });
        bar.appendChild(startBtn);
        countEl = el('span', 'tx-count'); bar.appendChild(countEl);
        subBtn = el('button', 'btn btn-sm btn-success'); subBtn.type = 'button';
        subBtn.addEventListener('click', function () {
            if (s.done) { s.a = {}; s.done = false; s.left = { '1': MIN['1'] * 60, '2': MIN['2'] * 60, '3': MIN['3'] * 60 }; view.confirm = false; save(); renderResult(); renderPanel(); refreshBar(); return; }
            if (answered() < all.length && !view.confirm) { view.confirm = true; refreshBar(); return; }
            stopClock(); s.done = true; s.tries = (s.tries || 0) + 1;
            var r = score(ex); if (!s.best || r.tot >= s.best.score) s.best = { score: r.tot, max: r.max };
            save(); renderResult(); renderPanel(); refreshBar(); resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        bar.appendChild(subBtn); root.appendChild(bar);
        resultBox = el('div'); root.appendChild(resultBox); panel = el('div'); root.appendChild(panel);
        renderResult(); renderPanel(); refreshBar();
        root.appendChild(el('p', 'tx-note', 'Tip: each Teil has its own clock. It starts with your first answer or with “Start clock”, and it shows + when you are over time. In the real exam the 90 minutes are shared with Sprachbausteine; here only the three Lesen Teile run.'));
    }
    function route() { var m = /^#exam-(\d+)$/.exec(location.hash); if (m) showExam(parseInt(m[1], 10)); else showList(); window.scrollTo(0, 0); }
    window.addEventListener('hashchange', route);
    window.addEventListener('pagehide', function () { save(); });
    route();
})();
</script>
